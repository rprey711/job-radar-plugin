[project]
name = "job-radar-plugin-dev"
version = "0.1.0"
description = "Entwicklungsumgebung fuer das Job-Radar-Plugin (Tests, Lint). Das Plugin selbst liegt unter plugins/job-radar."
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1",
    "docxtpl>=0.16.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["plugins/job-radar/scripts"]
